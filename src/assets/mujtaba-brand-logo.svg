    <text x="103" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="99" font-weight="700" fill="url(#gold)" stroke="#111827" stroke-width="2">B</text>
    <path d="M20 124c54-15 101-15 144-2 24 7 45 6 62-3-19 18-47 27-82 23-42-5-82-16-124-4z" fill="url(#silver)" opacity="0.9" />
    <path d="M72 36l47 61 45-61" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.86" />
