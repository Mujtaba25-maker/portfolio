<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-labelledby="title desc">
  <title id="title">Mujtaba logo</title>
  <desc id="desc">A professional MB monogram logo.</desc>
  <defs>
    <linearGradient id="silver" x1="12" x2="122" y1="18" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.35" stop-color="#cbd5e1" />
      <stop offset="0.68" stop-color="#64748b" />
      <stop offset="1" stop-color="#f8fafc" />
